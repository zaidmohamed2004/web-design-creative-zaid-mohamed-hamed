<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="5" cellpadding="5" cellspacing="3" align="center">
      <thead>
        <tr>
          <th rowspan="3">Day</th>
          <th colspan="4">Seminar</th>
        </tr>
        <tr>
          <th colspan="2">Schedule</th>
          <th rowspan="2" colspan="2">Topic</th>
        </tr>
        <tr>
          <th>Begin</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Monday</td>
          <td rowspan="2" bgcolor="lightyellow">8:00 a.m.</td>
          <td rowspan="2" bgcolor="">5:00 p.m.</td>
          <td colspan="2">Introduction to XML</td>
        </tr>
        <tr>
          <td colspan="2">Validity: DTD and Relax NG</td>
        </tr>

        <tr>
          <td rowspan="3">Tuesday</td>
          <td bgcolor="lightyellow">8:00 a.m.</td>
          <td bgcolor=lightyellow>11:00 a.m.</td>
          <td colspan="2">XPath</td>
        </tr>
        <tr>
          <td bgcolor="lightyellow">11:00 a.m.</td>
          <td bgcolor="#CCFFCC">2:00 p.m.</td>
          <td colspan="2" rowspan="2">XSL Transformations</td>
        </tr>
        <tr>
          <td bgcolor="#CCFFCC">2:00 p.m.</td>
          <td bgcolor="#CCCCFF">5:00 p.m.</td>
        </tr>
        
        <tr>
          <td>Wednesday</td>
          <td bgcolor="lightyellow">8:00 a.m.</td>
          <td bgcolor="#CCFFCC">12:00 p.m.</td>
          <td colspan="2">XSL Formatting Objects</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
